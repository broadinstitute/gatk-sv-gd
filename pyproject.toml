[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gatk-sv-gd"
version = "0.1.0"
description = "Genomic Disorder CNV detection from binned read counts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "BSD-3-Clause"}
dependencies = [
    "numpy",
    "pandas",
    "pysam",
    "intervaltree",
    "torch",
    "pyro-ppl",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "coverage[toml]",
    "pytest-cov",
    "flake8",
]

[project.scripts]
gatk-sv-gd = "gatk_sv_gd.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=gatk_sv_gd --cov-report=term-missing --cov-fail-under=90"
filterwarnings = [
    "ignore:'oneOf' deprecated - use 'one_of':DeprecationWarning:matplotlib\\._fontconfig_pattern",
    "ignore:'parseString' deprecated - use 'parse_string':DeprecationWarning:matplotlib\\._fontconfig_pattern",
    "ignore:'resetCache' deprecated - use 'reset_cache':DeprecationWarning:matplotlib\\._fontconfig_pattern",
    "ignore:'enablePackrat' deprecated - use 'enable_packrat':DeprecationWarning:matplotlib\\._mathtext",
]

[tool.coverage.run]
branch = true
source = ["gatk_sv_gd"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "build/coverage-html"